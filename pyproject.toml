[project]
name = "evresearch"
version = "1.2.0"
description = "EV Shuttle Research Framework — Bogor, Indonesia (CrewAI multi-agent, $0 LLM)"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pdfplumber",
    "python-dotenv",
    "numpy",
    "scipy",
]

[project.scripts]
evresearch = "evresearch.main:run"
run_crew = "evresearch.main:run"
train = "evresearch.main:train"
replay = "evresearch.main:replay"
test = "evresearch.main:test"
run_with_trigger = "evresearch.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
